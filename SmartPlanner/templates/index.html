<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Budget Predictor</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: url('https://t3.ftcdn.net/jpg/01/57/06/36/360_F_157063692_qrDkyZhmIvMqWP2HHJEYeflmmZLMhRbN.jpg');
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 700px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
            color: #444;
        }

        input,
        select {
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-container {
            margin-top: 25px;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5568d9;
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            background: #f0f7ff;
            border-radius: 10px;
            text-align: center;
        }

        .result h2 {
            color: #333;
        }

        .price {
            color: #667eea;
            font-size: 28px;
            font-weight: bold;
            margin-top: 8px;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Event Budget Predictor</h1>

        <p class="subtitle">
            Predict the estimated budget of your event using Machine Learning
        </p>

        <form action="/predict" method="POST">

            <div class="form-grid">

                <div class="form-group">
                    <label>Event Type</label>

                    <select name="event_type" required>
                        <option value="">Select Event Type</option>
                        <option value="Birthday">Birthday</option>
                        <option value="Wedding">Wedding</option>
                        <option value="Charity Gala">Charity Gala</option>
                        <option value="Baby Shower">Baby Shower</option>
                        <option value="Corporate Event">Corporate Event</option>
                        <option value="Conference">Conference</option>
                        <option value="Concert">Concert</option>
                    </select>
                </div>


                <div class="form-group">
                    <label>Number of Attendees</label>

                    <input
                        type="number"
                        name="attendees"
                        min="1"
                        placeholder="e.g. 150"
                        required>
                </div>


                <div class="form-group">
                    <label>Venue</label>

                    <select name="venue" required>
                        <option value="">Select Venue</option>
                        <option value="Oceanview Resort">Oceanview Resort</option>
                        <option value="Grand Ballroom">Grand Ballroom</option>
                        <option value="Marriott Hall">Marriott Hall</option>
                        <option value="Skyline Lounge">Skyline Lounge</option>
                        <option value="Garden Pavilion">Garden Pavilion</option>
                    </select>
                </div>


                <div class="form-group">
                    <label>Status</label>

                    <select name="status" required>
                        <option value="">Select Status</option>
                        <option value="Confirmed">Confirmed</option>
                        <option value="Cancelled">Cancelled</option>
                        <option value="Completed">Completed</option>
                        <option value="Pending">Pending</option>
                    </select>
                </div>


                <div class="form-group">
                    <label>Organizer</label>

                    <select name="organizer" required>
                        <option value="">Select Organizer</option>
                        <option value="Elite Events">Elite Events</option>
                        <option value="Joyous Moments Co.">Joyous Moments Co.</option>
                        <option value="Sparkle & Shine">Sparkle & Shine</option>
                    </select>
                </div>


                <div class="form-group">
                    <label>Event Year</label>

                    <input
                        type="number"
                        name="year"
                        value="2026"
                        required>
                </div>


                <div class="form-group">
                    <label>Event Month</label>

                    <input
                        type="number"
                        name="month"
                        min="1"
                        max="12"
                        placeholder="1-12"
                        required>
                </div>


                <div class="form-group">
                    <label>Event Day</label>

                    <input
                        type="number"
                        name="day"
                        min="1"
                        max="31"
                        placeholder="1-31"
                        required>
                </div>

            </div>


            <div class="button-container">

                <button type="submit">
                    Predict Event Budget
                </button>

            </div>

        </form>


        {% if prediction %}

        <div class="result">

            <h2>Estimated Event Budget</h2>

            <div class="price">
                ₹ {{ prediction }}
            </div>

        </div>

        {% endif %}

    </div>

</body>

</html>
